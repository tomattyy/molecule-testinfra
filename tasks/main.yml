---
# Etapa 2: declaramos o estado desejado do servidor Ubuntu.
- name: Instalar o Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    # Evita atualizações desnecessárias entre duas execuções do teste.
    cache_valid_time: 3600

- name: Iniciar e habilitar o servico Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
