---
# Etapa 3: ambiente efêmero Docker com systemd.
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: ubuntu-teste-nginx
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    override_command: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tty: true

provisioner:
  name: ansible

verifier:
  name: testinfra

# Sequência explícita: deixa o teste de idempotência visível no log.
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
